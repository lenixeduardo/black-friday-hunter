name: Build official-artwork PWA icons
on:
  push:
    branches: [feat/pwa-installable-v10]
    paths:
      - .github/workflows/pwa-icon-generation.yml
      - scripts/build_pwa_icons.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate maskable and Apple Touch icons from approved source
        run: python scripts/build_pwa_icons.py
      - name: Commit only generated PWA icons to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/icon-maskable-192.png app/icon-maskable-512.png app/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo 'Icon output unchanged'
            exit 0
          fi
          git commit -m 'assets(pwa): build maskable and iOS icons from original Magikarp [skip ci]'
          git push origin HEAD:feat/pwa-installable-v10
