name: Prepare authentic TCG category assets
on:
  push:
    branches: [feat/tcg-real-category-assets]
    paths:
      - ".github/workflows/prepare-tcg-category-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for lossless source handling
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Download and prepare PNG assets
        run: python scripts/sync_tcg_assets.py
      - name: Commit generated assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/tcg/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "assets: add source-matched Squirtle Pikachu Charizard scans [skip ci]"
          git push origin HEAD:feat/tcg-real-category-assets
