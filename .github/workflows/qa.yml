name: Black Friday Hunter QA
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit & structural checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate static manifest
        run: python -m json.tool app/manifest.webmanifest > /dev/null