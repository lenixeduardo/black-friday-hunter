name: Black Friday Hunter QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install 'pytest>=8,<10' 'Pillow>=10,<13' 'beautifulsoup4>=4.12,<5'
      - name: Validate Amazon catalog extraction
        run: node --test tests/test_amazon_catalog.mjs
      - name: Verify structural tests and original visual assets
        run: python -m pytest -q
      - name: Install Chromium for visual QA
        run: |
          python -m pip install 'playwright>=1.55,<1.62'
          python -m playwright install --with-deps chromium
      - name: Validate responsive fidelity, product cards and interactions
        run: python scripts/qa_fidelity_v5.py --out artifacts/qa-v5
      - name: Validate PWA manifest, SW, offline reloading and iOS install guidance
        run: python scripts/qa_pwa_v10.py --out artifacts/qa-pwa-v10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: black-friday-hunter-qa-v5
          path: |
            artifacts/qa-v5/
            artifacts/qa-pwa-v10/
            app/assets/icons/*.svg
            app/assets/icons/preview.html
          retention-days: 14
